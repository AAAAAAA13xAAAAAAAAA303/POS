/* ============================================================
   SAVE DATA
   ============================================================ */
$('saveBtn').addEventListener('click', () => {
  if (state.cart.length === 0) { toast('Cart is empty', 'warn'); return; }
  const { subtotal, discountAmt, deliveryFee, tax, total } = getTotals();
  const data = {
    store: STORE_NAME,
    timestamp: new Date().toISOString(),
    orderNumber: 'ORD-' + String(Math.floor(Math.random()*9000)+1000),
    orderType: state.orderType,
    payment: state.payment,
    buyer: {
      name: $('buyerName').value.trim() || null,
      phone: $('buyerPhone').value.trim() || null,
      location: $('buyerLocation').value.trim() || null
    },
    items: state.cart.map(i => ({
      id: i.id, name: i.name, unitPrice: i.price,
      quantity: i.quantity, lineTotal: +(i.price * i.quantity).toFixed(2),
      type: i.type, image: i.image || null
    })),
    discount: state.discount ? {
      code: state.discount.code, label: state.discount.label,
      pct: state.discount.pct, amount: +discountAmt.toFixed(2)
    } : null,
    deliveryFee: +deliveryFee.toFixed(2),
    summary: {
      subtotal: +subtotal.toFixed(2),
      discount: +discountAmt.toFixed(2),
      delivery: +deliveryFee.toFixed(2),
      tax: +tax.toFixed(2),
      total: +total.toFixed(2)
    }
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `order_${Date.now()}.json`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('Order saved as JSON', 'success');
  chime();
});

/* ============================================================
   STATS PANEL
   ============================================================ */
function renderStats() {
  const sorted = Object.entries(state.topItems)
    .sort((a,b) => b[1] - a[1]).slice(0, 5);

  const topHtml = sorted.length === 0
    ? '<div style="font-size:.72rem;color:var(--text-muted);text-align:center;padding:16px">No sales yet today</div>'
    : sorted.map(([name, qty], i) => `
      <div class="top-item">
        <div class="rank ${i === 0 ? 'gold' : ''}">${i + 1}</div>
        <div class="nm">${esc(name)}</div>
        <div class="vl">${qty}×</div>
      </div>`).join('');

  const avg = state.todayOrders > 0 ? state.todaySales / state.todayOrders : 0;

  $('statsBody').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Total Sales Today</div>
      <div class="stat-value">${fmt(state.todaySales)}</div>
      <div class="stat-sub">Across ${state.todayOrders} order${state.todayOrders === 1 ? '' : 's'}</div>
    </div>
    <div class="stat-grid">
      <div class="mini-stat"><div class="lbl">Orders</div><div class="val">${state.todayOrders}</div></div>
      <div class="mini-stat"><div class="lbl">Items Sold</div><div class="val">${state.todayItems}</div></div>
      <div class="mini-stat"><div class="lbl">Avg Order</div><div class="val">${fmt(avg)}</div></div>
      <div class="mini-stat"><div class="lbl">Menu Items</div><div class="val">${MENU.length}</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Top Sellers Today</div>
      <div class="top-items">${topHtml}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Quick Actions</div>
      <div style="display:flex;flex-direction:column;gap:7px;margin-top:7px">
        <button class="btn btn-ghost" id="resetStatsBtn" style="padding:9px;font-size:.72rem">🔄 Reset Today's Stats</button>
        <button class="btn btn-ghost" id="resetStockBtn" style="padding:9px;font-size:.72rem">📦 Reset Stock Counts</button>
        <button class="btn btn-ghost" id="exportStatsBtn" style="padding:9px;font-size:.72rem">📤 Export Stats</button>
      </div>
    </div>`;

  $('resetStatsBtn').addEventListener('click', () => {
    if (!confirm('Reset today\'s stats?')) return;
    state.todaySales = 0; state.todayOrders = 0;
    state.todayItems = 0; state.topItems = {};
    persist(); renderStats(); renderCart();
    toast('Stats reset', 'info');
  });

  $('resetStockBtn').addEventListener('click', () => {
    if (!confirm('Reset all stock counts?')) return;
    state.stockUsed = {};
    persist(); renderStats(); renderMenu();
    toast('Stock counts reset', 'info');
  });

  $('exportStatsBtn').addEventListener('click', () => {
    const data = {
      date: new Date().toDateString(),
      sales: state.todaySales, orders: state.todayOrders,
      items: state.todayItems, topItems: state.topItems,
      stockUsed: state.stockUsed
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `stats_${Date.now()}.json`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    toast('Stats exported', 'success');
  });
}

function openStats() { renderStats(); $('statsPanel').classList.add('open'); }
function closeStats() { $('statsPanel').classList.remove('open'); }
$('statsBtn').addEventListener('click', openStats);
$('statsClose').addEventListener('click', closeStats);

/* ============================================================
   KEYBOARD
   ============================================================ */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea';

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    $('searchInput').focus(); $('searchInput').select();
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
    e.preventDefault(); $('themeBtn').click();
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault(); $('saveBtn').click();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    if (!$('checkoutBtn').disabled) $('checkoutBtn').click();
  }
  if (e.key === 'F2') { e.preventDefault(); openStats(); }
  if (e.key === 'F9') {
    e.preventDefault();
    if (!$('checkoutBtn').disabled) $('checkoutBtn').click();
  }
  if (e.key === 'Escape') {
    if ($('receiptModal').classList.contains('active')) closeReceipt();
    else if ($('statsPanel').classList.contains('open')) closeStats();
    else if (isMobile() && $('cartArea').classList.contains('open')) closeCartDrawer();
    else if (typing) e.target.blur();
  }
});

/* ============================================================
   RESIZE
   ============================================================ */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!isMobile()) {
      $('cartArea').classList.remove('open');
      $('drawerBackdrop').classList.remove('show');
    }
  }, 150);
});

/* ============================================================
   INIT
   ============================================================ */
function init() {
  hydrate();
  applyTheme();
  renderTabs();
  renderMenu();
  renderCart();
  persist();
}

init();
window.addEventListener('beforeunload', persist);
</script>
