<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#06070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Café Lumière · Premium POS & Online Shop">
<title>Café Lumière · POS & Online Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RESET
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*::selection{background:var(--gold);color:#1a1408}
img{max-width:100%;height:auto;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --gold:#c9a961;
  --gold-bright:#e6c980;
  --gold-deep:#8a7340;
  --green:#4ade80;
  --red:#f87171;
  --blue:#60a5fa;
  --purple:#a78bfa;
  --pink:#f472b6;
  --orange:#fb923c;

  --r-xs:6px;
  --r-sm:10px;
  --r-md:14px;
  --r-lg:18px;
  --r-xl:24px;
  --r-2xl:32px;

  --f-sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --f-display:'Playfair Display',Georgia,serif;
  --f-mono:'JetBrains Mono',monospace;

  --t-fast:.15s cubic-bezier(.4,0,.2,1);
  --t-med:.25s cubic-bezier(.4,0,.2,1);
  --t-slow:.45s cubic-bezier(.4,0,.2,1);
  --t-spring:.55s cubic-bezier(.34,1.4,.64,1);
}

[data-theme="dark"]{
  --bg-app:#06070a;
  --bg-surface:#0d1017;
  --bg-elevated:#141922;
  --bg-card:#1a212c;
  --bg-card-hover:#232c39;
  --bg-input:#090b10;
  --bg-overlay:rgba(0,0,0,.85);
  --border-subtle:rgba(255,255,255,.06);
  --border-medium:rgba(255,255,255,.1);
  --border-strong:rgba(255,255,255,.18);
  --text-primary:#f5f8fc;
  --text-secondary:#94a3b5;
  --text-muted:#55637a;
  --text-inverse:#06070a;
  --shadow-sm:0 2px 8px rgba(0,0,0,.4);
  --shadow-md:0 8px 24px rgba(0,0,0,.5);
  --shadow-lg:0 24px 60px rgba(0,0,0,.65);
  --shadow-xl:0 40px 100px rgba(0,0,0,.8);
  --glow-gold:0 0 40px rgba(201,169,97,.35);
  --glow-green:0 0 28px rgba(74,222,128,.4);
  --glass:rgba(26,33,44,.72);
  --glass-strong:rgba(20,25,34,.92);
}

[data-theme="light"]{
  --bg-app:#eef1f8;
  --bg-surface:#ffffff;
  --bg-elevated:#f6f8fc;
  --bg-card:#ffffff;
  --bg-card-hover:#f0f4fb;
  --bg-input:#f6f8fc;
  --bg-overlay:rgba(15,23,42,.5);
  --border-subtle:rgba(15,23,42,.06);
  --border-medium:rgba(15,23,42,.1);
  --border-strong:rgba(15,23,42,.2);
  --text-primary:#0a1220;
  --text-secondary:#475569;
  --text-muted:#94a3b8;
  --text-inverse:#ffffff;
  --shadow-sm:0 2px 8px rgba(15,23,42,.06);
  --shadow-md:0 8px 24px rgba(15,23,42,.08);
  --shadow-lg:0 24px 60px rgba(15,23,42,.12);
  --shadow-xl:0 40px 100px rgba(15,23,42,.18);
  --glow-gold:0 8px 40px rgba(201,169,97,.35);
  --glow-green:0 8px 28px rgba(74,222,128,.35);
  --glass:rgba(255,255,255,.75);
  --glass-strong:rgba(255,255,255,.95);
}

/* ============================================================
   BASE
   ============================================================ */
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--f-sans);
  background:var(--bg-app);
  color:var(--text-primary);
  transition:background var(--t-slow),color var(--t-slow);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-size:14px;
  line-height:1.5;
}

body::before{
  content:'';position:fixed;inset:-50%;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 20% 30%,rgba(201,169,97,.14),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(96,165,250,.1),transparent 40%),
    radial-gradient(circle at 50% 50%,rgba(167,139,250,.06),transparent 50%);
  animation:bgShift 30s ease-in-out infinite;
}

[data-theme="light"] body::before{
  background:
    radial-gradient(circle at 20% 30%,rgba(201,169,97,.22),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(96,165,250,.14),transparent 40%),
    radial-gradient(circle at 50% 50%,rgba(167,139,250,.1),transparent 50%);
}

@keyframes bgShift{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  33%{transform:translate(3%,-3%) rotate(1deg)}
  66%{transform:translate(-3%,3%) rotate(-1deg)}
}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{
  position:relative;z-index:1;
  display:grid;
  grid-template-rows:auto 1fr;
  height:100vh;
  height:100dvh;
  max-width:1920px;
  margin:0 auto;
}

/* ============================================================
   TOP BAR
   ============================================================ */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:10px 18px;
  padding-top:calc(10px + env(safe-area-inset-top));
  background:var(--glass);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border-bottom:1px solid var(--border-subtle);
  z-index:50;
  min-height:64px;
}

.brand{
  display:flex;align-items:center;gap:10px;
  padding-right:14px;
  border-right:1px solid var(--border-subtle);
  flex-shrink:0;
}

.brand-mark{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(145deg,var(--gold-bright),var(--gold-deep));
  display:flex;align-items:center;justify-content:center;
  font-size:1.25rem;color:#1a1408;
  box-shadow:var(--glow-gold);
  position:relative;overflow:hidden;
  flex-shrink:0;
}

.brand-mark::before{
  content:'';position:absolute;inset:-50%;
  background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.5),transparent 30%);
  animation:spin 8s linear infinite;
}

.brand-mark::after{
  content:'✦';position:relative;z-index:1;
  animation:brandPulse 4s ease-in-out infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes brandPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.12)}
}

.brand-text h1{
  font-family:var(--f-display);
  font-size:1.05rem;font-weight:700;letter-spacing:-.01em;
  background:linear-gradient(135deg,var(--text-primary),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;line-height:1.1;
}

.brand-text p{
  font-size:.56rem;color:var(--text-muted);
  letter-spacing:.18em;text-transform:uppercase;
  font-weight:700;margin-top:1px;
}

.topbar-center{
  flex:1;display:flex;align-items:center;gap:10px;
  justify-content:center;min-width:0;
}

.search-box{
  flex:1;max-width:520px;position:relative;
}

.search-box input{
  width:100%;
  padding:10px 16px 10px 40px;
  background:var(--bg-input);
  border:1px solid var(--border-subtle);
  border-radius:100px;
  color:var(--text-primary);
  font-size:.82rem;font-weight:500;
  outline:none;transition:all var(--t-med);
}

.search-box input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(201,169,97,.15),var(--glow-gold);
  background:var(--bg-card);
}

.search-box input::placeholder{color:var(--text-muted)}

.search-box::before{
  content:'⌕';position:absolute;left:16px;top:50%;
  transform:translateY(-50%);font-size:1.1rem;opacity:.5;
  pointer-events:none;font-weight:600;
}

.search-clear{
  position:absolute;right:6px;top:50%;
  transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;
  background:transparent;border:none;
  color:var(--text-muted);cursor:pointer;
  display:none;align-items:center;justify-content:center;
  font-size:.85rem;transition:all var(--t-fast);
}
.search-clear:hover{background:var(--bg-card);color:var(--text-primary)}
.search-box.has-value .search-clear{display:flex}

.topbar-right{
  display:flex;align-items:center;gap:6px;
  flex-shrink:0;
}

.live-clock{
  font-family:var(--f-mono);
  font-size:.72rem;font-weight:700;
  color:var(--text-secondary);
  padding:8px 12px;border-radius:100px;
  background:var(--bg-input);
  border:1px solid var(--border-subtle);
  display:flex;align-items:center;gap:7px;
  letter-spacing:.02em;
}

.live-clock .pulse{
  width:6px;height:6px;border-radius:50%;background:var(--green);
  box-shadow:0 0 12px var(--green);
  animation:pulse 1.5s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(.7)}
}

.icon-btn{
  width:38px;height:38px;border-radius:11px;
  background:var(--bg-input);border:1px solid var(--border-subtle);
  color:var(--text-secondary);
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;transition:all var(--t-med);
  position:relative;overflow:hidden;flex-shrink:0;
}

.icon-btn:hover{
  background:var(--bg-card);
  border-color:var(--gold);
  color:var(--gold);
  transform:translateY(-2px);
  box-shadow:var(--glow-gold);
}

.icon-btn:active{transform:translateY(0) scale(.94)}

.icon-btn .badge-dot{
  position:absolute;top:5px;right:5px;
  width:7px;height:7px;border-radius:50%;
  background:var(--red);
  border:2px solid var(--bg-surface);
  animation:pulse 2s infinite;
}

/* ============================================================
   MAIN GRID
   ============================================================ */
.main{
  display:grid;
  grid-template-columns:1fr 400px;
  overflow:hidden;
  height:calc(100vh - 64px);
  height:calc(100dvh - 64px - env(safe-area-inset-top));
}

/* ============================================================
   MENU AREA
   ============================================================ */
.menu-area{
  padding:18px 22px 22px;
  overflow-y:auto;
  display:flex;flex-direction:column;gap:16px;
  scroll-behavior:smooth;
}

.menu-area::-webkit-scrollbar{width:8px}
.menu-area::-webkit-scrollbar-track{background:transparent}
.menu-area::-webkit-scrollbar-thumb{
  background:var(--border-medium);border-radius:10px;
}
.menu-area::-webkit-scrollbar-thumb:hover{background:var(--gold)}

/* Shop Mode toggle */
.shop-mode{
  display:flex;gap:4px;
  padding:4px;background:var(--bg-input);
  border-radius:100px;border:1px solid var(--border-subtle);
  width:fit-content;
  margin:0 auto;
}

.mode-btn{
  padding:8px 18px;border-radius:100px;
  background:transparent;border:none;
  font-size:.74rem;font-weight:700;
  color:var(--text-muted);transition:all var(--t-med);
  display:flex;align-items:center;gap:6px;
  letter-spacing:.02em;
}

.mode-btn.active{
  background:var(--bg-card);
  color:var(--text-primary);
  box-shadow:var(--shadow-sm);
}

.mode-btn:hover:not(.active){color:var(--text-primary)}

/* Hero banner */
.hero{
  background:linear-gradient(135deg,rgba(201,169,97,.12),rgba(96,165,250,.06));
  border:1px solid var(--border-subtle);
  border-radius:var(--r-lg);
  padding:18px 22px;
  display:flex;justify-content:space-between;align-items:center;
  gap:16px;
  overflow:hidden;
  position:relative;
}

.hero::before{
  content:'';position:absolute;top:-50%;right:-10%;
  width:280px;height:280px;
  background:radial-gradient(circle,rgba(201,169,97,.15),transparent 70%);
  animation:float 8s ease-in-out infinite;
  pointer-events:none;
}

@keyframes float{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(-20px,20px) scale(1.1)}
}

.hero-text h2{
  font-family:var(--f-display);
  font-size:1.35rem;font-weight:700;
  letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--text-primary),var(--gold-bright));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:4px;
}

.hero-text p{
  font-size:.78rem;color:var(--text-secondary);
  font-weight:500;
}

.hero-stats{
  display:flex;gap:18px;
  position:relative;z-index:1;
}

.hero-stat{text-align:right}

.hero-stat .v{
  font-family:var(--f-mono);
  font-size:1.05rem;font-weight:800;
  color:var(--gold-bright);
  letter-spacing:-.02em;
}

.hero-stat .l{
  font-size:.58rem;color:var(--text-muted);
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  margin-top:2px;
}

/* Category Tabs */
.tabs{
  display:flex;gap:6px;overflow-x:auto;
  padding-bottom:4px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.tabs::-webkit-scrollbar{display:none}

.tab{
  padding:8px 15px;
  background:var(--bg-card);
  border:1px solid var(--border-subtle);
  border-radius:100px;
  color:var(--text-secondary);
  font-size:.74rem;font-weight:600;
  cursor:pointer;white-space:nowrap;
  transition:all var(--t-med);
  display:flex;align-items:center;gap:6px;
  letter-spacing:.02em;
  flex-shrink:0;
  position:relative;overflow:hidden;
}

.tab::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(145deg,var(--gold-bright),var(--gold));
  opacity:0;transition:opacity var(--t-med);
  z-index:-1;
}

.tab:hover{
  background:var(--bg-card-hover);
  color:var(--text-primary);
  transform:translateY(-2px);
}

.tab.active{
  color:#1a1408;
  border-color:transparent;
  box-shadow:var(--glow-gold);
  font-weight:700;
}

.tab.active::before{opacity:1}
.tab > *{position:relative;z-index:1}

.tab .count{
  padding:1px 6px;border-radius:100px;
  background:rgba(0,0,0,.15);
  font-size:.58rem;font-weight:700;
  min-width:20px;text-align:center;
  font-family:var(--f-mono);
}

.tab.active .count{background:rgba(0,0,0,.2)}

/* Menu Grid */
.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:14px;
}

.menu-card{
  background:var(--bg-card);
  border:1px solid var(--border-subtle);
  border-radius:var(--r-lg);
  cursor:pointer;
  transition:all var(--t-med);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  user-select:none;
  animation:cardIn .5s cubic-bezier(.34,1.4,.64,1) backwards;
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(16px) scale(.95)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.menu-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(201,169,97,.15),transparent 50%);
  opacity:0;transition:opacity var(--t-med);pointer-events:none;
  z-index:2;
}

.menu-card::after{
  content:'';position:absolute;
  top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:0;transition:opacity var(--t-med);
  z-index:3;
}

.menu-card:hover{
  background:var(--bg-card-hover);
  border-color:rgba(201,169,97,.4);
  transform:translateY(-5px);
  box-shadow:var(--shadow-md),0 0 0 1px rgba(201,169,97,.15),var(--glow-gold);
}

.menu-card:hover::before,
.menu-card:hover::after{opacity:1}
.menu-card:active{transform:translateY(-2px) scale(.98)}

.menu-card.out-of-stock{
  opacity:.55;
  pointer-events:none;
  filter:grayscale(.6);
}

/* Card image */
.card-image{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  overflow:hidden;
  background:linear-gradient(145deg,var(--bg-elevated),var(--bg-card));
  display:flex;align-items:center;justify-content:center;
}

.card-image img{
  width:100%;height:100%;
  object-fit:cover;
  transition:transform var(--t-slow) cubic-bezier(.4,0,.2,1);
  display:block;
}

.menu-card:hover .card-image img{transform:scale(1.08)}

.card-image .fallback-emoji{
  font-size:3rem;
  filter:drop-shadow(0 4px 16px rgba(0,0,0,.3));
  transition:transform var(--t-spring);
}

.menu-card:hover .card-image .fallback-emoji{
  transform:scale(1.12) rotate(-6deg);
}

.card-image::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.4) 100%);
  pointer-events:none;
}

/* Badges */
.card-badge{
  position:absolute;top:9px;left:9px;
  padding:3px 9px;border-radius:100px;
  font-size:.58rem;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;
  z-index:2;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.badge-new{background:rgba(74,222,128,.92);color:#0a1a0e;box-shadow:0 4px 12px rgba(74,222,128,.4)}
.badge-hot{background:rgba(248,113,113,.92);color:#1a0606;box-shadow:0 4px 12px rgba(248,113,113,.4)}
.badge-pop{background:rgba(201,169,97,.92);color:#1a1408;box-shadow:0 4px 12px rgba(201,169,97,.4)}
.badge-stock{background:rgba(96,165,250,.92);color:#041022;box-shadow:0 4px 12px rgba(96,165,250,.4)}

.fav-btn{
  position:absolute;top:9px;right:9px;
  width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.15);
  color:#fff;font-size:.9rem;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all var(--t-med);
  z-index:3;opacity:.85;
}

.fav-btn:hover{
  transform:scale(1.15);
  background:rgba(201,169,97,.92);
  color:#1a1408;border-color:transparent;
  opacity:1;
}

.menu-card.fav .fav-btn{
  background:linear-gradient(145deg,var(--gold-bright),var(--gold));
  color:#1a1408;border-color:transparent;
  opacity:1;
  box-shadow:var(--glow-gold);
}

/* Card body */
.card-body{
  padding:12px 14px 14px;
  display:flex;flex-direction:column;gap:6px;
  position:relative;z-index:1;
}

.card-cat{
  font-size:.56rem;font-weight:700;
  color:var(--gold);
  letter-spacing:.12em;text-transform:uppercase;
  opacity:.85;
}

.card-name{
  font-size:.88rem;font-weight:700;
  color:var(--text-primary);
  letter-spacing:-.01em;line-height:1.25;
  overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;
  min-height:2.2em;
}

.card-desc{
  font-size:.68rem;color:var(--text-muted);
  line-height:1.4;
  overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;
  min-height:1.9em;
}

.card-bottom{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:4px;padding-top:8px;
  border-top:1px solid var(--border-subtle);
}

.card-price{
  font-family:var(--f-mono);
  font-size:1rem;font-weight:800;
  color:var(--gold-bright);
  letter-spacing:-.02em;
}

.add-fab{
  width:32px;height:32px;border-radius:10px;
  background:rgba(201,169,97,.12);
  border:1px solid rgba(201,169,97,.3);
  color:var(--gold);font-size:1rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  transition:all var(--t-spring);
  pointer-events:none;
}

.menu-card:hover .add-fab{
  background:linear-gradient(145deg,var(--gold-bright),var(--gold));
  color:#1a1408;border-color:transparent;
  transform:rotate(180deg) scale(1.12);
  box-shadow:var(--glow-gold);
}

/* No results */
.no-results{
  grid-column:1/-1;padding:60px 20px;text-align:center;
  color:var(--text-muted);
  animation:cardIn .5s;
}
.no-results .icon{
  font-size:3.5rem;margin-bottom:12px;opacity:.4;
  display:inline-block;animation:float 3s infinite;
}
.no-results h3{
  font-family:var(--f-display);
  font-size:1.15rem;color:var(--text-secondary);
  margin-bottom:4px;font-weight:700;
}
.no-results p{font-size:.8rem}

/* ============================================================
   CART AREA
   ============================================================ */
.cart-area{
  background:var(--bg-surface);
  border-left:1px solid var(--border-subtle);
  display:flex;flex-direction:column;
  overflow:hidden;position:relative;
}

.cart-area::before{
  content:'';position:absolute;
  top:0;left:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,rgba(201,169,97,.25),transparent);
  z-index:1;
}

.cart-header{
  padding:16px 20px 12px;
  border-bottom:1px solid var(--border-subtle);
  background:var(--bg-surface);
  position:relative;z-index:2;
}

.cart-header-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}

.cart-title{display:flex;align-items:center;gap:10px}

.cart-title-icon{
  width:40px;height:40px;border-radius:12px;
  background:rgba(201,169,97,.1);
  border:1px solid rgba(201,169,97,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;position:relative;
}

.cart-badge{
  position:absolute;top:-5px;right:-5px;
  min-width:22px;height:22px;padding:0 5px;
  border-radius:100px;
  background:linear-gradient(145deg,var(--gold-bright),var(--gold));
  color:#1a1408;
  font-size:.66rem;font-weight:800;
  font-family:var(--f-mono);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--glow-gold);
  border:2px solid var(--bg-surface);
}

.cart-badge.bump{animation:bump var(--t-spring)}

@keyframes bump{
  0%{transform:scale(1)}
  40%{transform:scale(1.5) rotate(-8deg)}
  70%{transform:scale(.9) rotate(4deg)}
  100%{transform:scale(1) rotate(0)}
}

.cart-title-text h2{
  font-size:.95rem;font-weight:700;
  letter-spacing:-.01em;
}

.cart-title-text p{
  font-size:.65rem;color:var(--text-muted);
  margin-top:1px;font-weight:500;
}

.clear-btn{
  background:transparent;border:1px solid var(--border-subtle);
  color:var(--text-muted);
  font-size:.68rem;font-weight:700;
  padding:7px 12px;border-radius:100px;
  transition:all var(--t-fast);letter-spacing:.02em;
}

.clear-btn:hover{
  border-color:rgba(248,113,113,.5);
  color:var(--red);background:rgba(248,113,113,.1);
  transform:scale(1.05);
}

/* Order Type */
.order-type{
  display:grid;grid-template-columns:repeat(3,1fr);gap:3px;
  padding:3px;background:var(--bg-input);
  border-radius:100px;border:1px solid var(--border-subtle);
}

.type-pill{
  padding:7px 4px;border-radius:100px;
  background:transparent;border:none;
  font-size:.68rem;font-weight:700;
  color:var(--text-muted);transition:all var(--t-med);
  display:flex;align-items:center;justify-content:center;gap:3px;
  letter-spacing:.02em;
}

.type-pill.active{
  background:var(--bg-card);
  color:var(--text-primary);
  box-shadow:var(--shadow-sm);
}

.type-pill:hover:not(.active){color:var(--text-primary)}

/* Cart Body */
.cart-body{
  flex:1;overflow-y:auto;
  padding:12px 20px;
  display:flex;flex-direction:column;gap:10px;
  scroll-behavior:smooth;
}

.cart-body::-webkit-scrollbar{width:6px}
.cart-body::-webkit-scrollbar-track{background:transparent}
.cart-body::-webkit-scrollbar-thumb{
  background:var(--border-medium);border-radius:10px;
}
.cart-body::-webkit-scrollbar-thumb:hover{background:var(--gold)}

/* Customer card */
.customer-card{
  background:var(--bg-card);
  border:1px solid var(--border-subtle);
  border-radius:var(--r-md);
  padding:12px;
  position:relative;overflow:hidden;
}

.customer-card::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(74,222,128,.6),transparent);
}

.customer-head{
  display:flex;align-items:center;gap:7px;
  margin-bottom:9px;
}

.customer-head .icon{
  width:24px;height:24px;border-radius:7px;
  background:rgba(74,222,128,.12);
  border:1px solid rgba(74,222,128,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;
}

.customer-head span{
  font-size:.62rem;font-weight:700;
  color:var(--green);letter-spacing:.12em;text-transform:uppercase;
}

.customer-head .opt{
  margin-left:auto;font-size:.58rem;color:var(--text-muted);
  font-weight:500;letter-spacing:.04em;text-transform:none;
}

.inputs{display:flex;flex-direction:column;gap:5px}

.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap .ico{
  position:absolute;left:10px;font-size:.75rem;
  opacity:.5;pointer-events:none;transition:opacity var(--t-fast);
}

.input-wrap:focus-within .ico{opacity:1}

.input-wrap input{
  width:100%;
  padding:9px 11px 9px 32px;
  background:var(--bg-input);
  border:1px solid var(--border-subtle);
  border-radius:var(--r-xs);
  color:var(--text-primary);
  font-size:.78rem;font-weight:500;
  outline:none;transition:all var(--t-fast);
}

.input-wrap input::placeholder{color:var(--text-muted);font-weight:400}

.input-wrap input:focus{
  border-color:rgba(201,169,97,.5);
  background:var(--bg-card);
  box-shadow:0 0 0 3px rgba(201,169,97,.1);
}

/* Cart items */
.items-list{display:flex;flex-direction:column;gap:7px}

.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 16px;text-align:center;
}

.empty-icon{
  width:68px;height:68px;border-radius:22px;
  background:var(--bg-card);
  border:1.5px dashed var(--border-medium);
  display:flex;align-items:center;justify-content:center;
  font-size:1.7rem;margin-bottom:12px;opacity:.5;
  animation:float 3s ease-in-out infinite;
}

.empty-state h3{
  font-family:var(--f-display);
  font-size:1rem;color:var(--text-secondary);
  font-weight:700;margin-bottom:3px;
}

.empty-state p{font-size:.72rem;color:var(--text-muted)}

.item{
  display:flex;align-items:center;gap:10px;
  background:var(--bg-card);
  border:1px solid var(--border-subtle);
  border-radius:var(--r-md);
  padding:9px 11px;
  transition:all var(--t-med);
  animation:slideIn var(--t-med) cubic-bezier(.4,0,.2,1);
}

@keyframes slideIn{
  from{opacity:0;transform:translateX(16px) scale(.96)}
  to{opacity:1;transform:translateX(0) scale(1)}
}

.item:hover{
  background:var(--bg-card-hover);
  border-color:var(--border-medium);
  transform:translateX(-2px);
}

.item-emoji{
  width:40px;height:40px;border-radius:11px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--border-subtle);
  display:flex;align-items:center;justify-content:center;
  font-size:1.25rem;flex-shrink:0;
  overflow:hidden;
}

.item-emoji img{width:100%;height:100%;object-fit:cover}

.item-info{flex:1;min-width:0}

.item-name{
  font-size:.8rem;font-weight:600;
  color:var(--text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.item-unit{
  font-size:.66rem;color:var(--text-muted);
  margin-top:1px;font-family:var(--f-mono);
}

.item-controls{
  display:flex;align-items:center;gap:2px;
  background:var(--bg-app);
  border-radius:100px;padding:2px;
  border:1px solid var(--border-subtle);
}

.qty-btn{
  width:24px;height:24px;border-radius:50%;
  background:transparent;border:none;
  color:var(--text-secondary);
  font-size:.95rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  transition:all var(--t-fast);line-height:1;
}

.qty-btn:hover{
  background:rgba(201,169,97,.15);
  color:var(--gold-bright);
  transform:scale(1.1);
}

.qty-btn.dec:hover{background:rgba(248,113,113,.15);color:var(--red)}

.qty-val{
  min-width:22px;text-align:center;
  font-size:.74rem;font-weight:700;
  color:var(--text-primary);
  font-family:var(--f-mono);
}

.item-total{
  font-size:.8rem;font-weight:800;
  color:var(--gold-bright);
  font-family:var(--f-mono);
  min-width:58px;text-align:right;flex-shrink:0;
  letter-spacing:-.02em;
}

/* ============================================================
   CART FOOTER
   ============================================================ */
.cart-footer{
  padding:12px 20px 16px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
  background:var(--bg-surface);
  border-top:1px solid var(--border-subtle);
  display:flex;flex-direction:column;gap:9px;
  position:relative;z-index:2;
}

.discount-row{display:flex;gap:6px}

.discount-row input{
  flex:1;
  padding:10px 13px;
  background:var(--bg-input);
  border:1px solid var(--border-subtle);
  border-radius:var(--r-sm);
  color:var(--text-primary);
  font-family:var(--f-mono);font-size:.74rem;font-weight:700;
  outline:none;transition:all var(--t-fast);
  text-transform:uppercase;letter-spacing:.04em;
}

.discount-row input::placeholder{
  color:var(--text-muted);text-transform:none;
  letter-spacing:0;font-weight:400;
  font-family:var(--f-sans);
}

.discount-row input:focus{
  border-color:var(--gold);
  background:var(--bg-card);
  box-shadow:0 0 0 3px rgba(201,169,97,.12);
}

.apply-btn{
  padding:0 18px;border-radius:var(--r-sm);
  background:var(--bg-card);
  border:1px solid var(--border-medium);
  color:var(--text-primary);
  font-size:.72rem;font-weight:700;
  transition:all var(--t-med);
  letter-spacing:.02em;
}

.apply-btn:hover{
  background:linear-gradient(145deg,var(--gold-bright),var(--gold));
  color:#1a1408;border-color:transparent;
  box-shadow:var(--glow-gold);
  transform:translateY(-1px);
}

.discount-tag{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 13px;border-radius:100px;
  background:rgba(74,222,128,.12);
  border:1px solid rgba(74,222,128,.35);
  font-size:.72rem;font-weight:700;
  color:var(--green);
  animation:slideIn var(--t-med);
}

.discount-tag button{
  background:transparent;border:none;color:var(--green);
  font-size:.95rem;
  display:flex;align-items:center;
  opacity:.7;transition:opacity var(--t-fast);
}
.discount-tag button:hover{opacity:1;transform:scale(1.15)}

.summary{
  background:var(--bg-card);
  border:1px solid var(--border-subtle);
  border-radius:var(--r-md);
  padding:12px 14px;
  position:relative;overflow:hidden;
}

.summary::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(201,169,97,.6),transparent);
}

.sum-row{
  display:flex;justify-content:space-between;
  padding:4px 0;font-size:.78rem;
  color:var(--text-secondary);
}

.sum-row span:last-child{
  font-weight:600;color:var(--text-primary);
  font-family:var(--f-mono);letter-spacing:-.01em;
}

.sum-row.discount span:last-child{color:var(--green)}

.sum-row.total{
  margin-top:7px;padding-top:11px;
  border-top:1px solid var(--border-subtle);
}

.sum-row.total span:first-child{
  font-size:.84rem;font-weight:700;
  color:var(--text-primary);letter-spacing:.02em;
}

.sum-row.total span:last-child{
  font-size:1.25rem;font-weight:800;
  color:var(--gold-bright);
  font-family:var(--f-mono);letter-spacing:-.03em;
}

.payment-row{
  display:grid;grid-template-columns:repeat(3,1fr);gap:5px;
}

.pay-btn{
  padding:9px 4px;border-radius:var(--r-sm);
  background:var(--bg-card);
  border:1px solid var(--border-subtle);
  color:var(--text-secondary);
  font-size:.68rem;font-weight:700;
  transition:all var(--t-med);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  letter-spacing:.02em;
}

.pay-btn span:first-child{font-size:1rem}

.pay-btn:hover{
  background:var(--bg-card-hover);
  color:var(--text-primary);
  transform:translateY(-2px);
}

.pay-btn.active{
  background:linear-gradient(145deg,var(--gold-bright),var(--gold));
  color:#1a1408;border-color:transparent;
  box-shadow:var(--glow-gold);
}

.actions{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:7px;
}

.btn{
  padding:13px 16px;
  border-radius:var(--r-md);
  font-size:.82rem;font-weight:700;
  transition:all var(--t-med);
  display:flex;align-items:center;justify-content:center;gap:7px;
  letter-spacing:.01em;
  position:relative;overflow:hidden;
}

.btn:disabled{opacity:.35;cursor:not-allowed}

.btn-ghost{
  background:var(--bg-card);
  color:var(--text-secondary);
  border:1px solid var(--border-medium);
  padding:13px;
}

.btn-ghost:hover:not(:disabled){
  background:var(--bg-card-hover);
  color:var(--text-primary);
  border-color:var(--gold);
  transform:translateY(-2px);
}

.btn-primary{
  background:linear-gradient(145deg,var(--gold-bright),var(--gold));
  color:#1a1408;
  box-shadow:var(--glow-gold);
  font-size:.85rem;
  padding:13px 18px;
}

.btn-primary::after{
  content:'';position:absolute;top:0;left:-100%;
  width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  transition:left .7s;
}

.btn-primary:hover:not(:disabled)::after{left:100%}
.btn-primary:hover:not(:disabled){
  transform:translateY(-2px) scale(1.02);
  box-shadow:0 14px 48px rgba(201,169,97,.5);
}
.btn-primary:active:not(:disabled){transform:translateY(0) scale(.98)}

/* ============================================================
   RIPPLE
   ============================================================ */
.ripple{
  position:absolute;border-radius:50%;
  background:rgba(255,255,255,.6);
  transform:scale(0);animation:ripple .7s ease-out;
  pointer-events:none;z-index:10;
}

@keyframes ripple{
  to{transform:scale(4);opacity:0}
}

/* ============================================================
   MODALS
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;
  background:var(--bg-overlay);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  display:none;align-items:center;justify-content:center;
  z-index:1000;padding:20px;
  opacity:0;transition:opacity var(--t-med);
  overflow-y:auto;
}

.modal-overlay.active{display:flex;opacity:1}

.receipt-modal{
  background:#faf8f4;color:#1a1a1a;
  max-width:420px;width:100%;
  border-radius:20px;
  padding:0;
  box-shadow:0 40px 100px rgba(0,0,0,.75);
  max-height:92vh;overflow:hidden;
  position:relative;
  display:flex;flex-direction:column;
  animation:receiptIn .5s cubic-bezier(.34,1.4,.64,1);
  margin:auto;
}

@keyframes receiptIn{
  from{opacity:0;transform:translateY(40px) scale(.9) rotate(-2deg)}
  to{opacity:1;transform:translateY(0) scale(1) rotate(0)}
}

.receipt-modal::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,var(--gold-deep),var(--gold-bright),var(--gold-deep));
  z-index:2;
}

.receipt-scroll{
  overflow-y:auto;
  padding:26px 24px 20px;
  flex:1;
}

.receipt-scroll::-webkit-scrollbar{width:6px}
.receipt-scroll::-webkit-scrollbar-thumb{
  background:#d4cfc5;border-radius:10px;
}

.receipt-header{
  text-align:center;margin-bottom:18px;
  padding-bottom:16px;
  border-bottom:1.5px dashed #d4cfc5;
}

.receipt-logo{
  width:54px;height:54px;border-radius:16px;
  background:linear-gradient(145deg,#e6c980,#8a7340);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 10px;font-size:1.55rem;color:#1a1408;
  box-shadow:0 8px 24px rgba(201,169,97,.4);
  animation:brandPulse 3s ease-in-out infinite;
}

.receipt-header h3{
  font-family:var(--f-display);
  font-size:1.05rem;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;
  color:#1a1a1a;
}

.receipt-header .sub{
  font-size:.66rem;color:#8a8578;
  margin-top:3px;letter-spacing:.05em;
}

.receipt-meta{
  display:grid;grid-template-columns:1fr 1fr;
  gap:5px 12px;font-size:.68rem;color:#8a8578;
  margin-bottom:16px;padding-bottom:14px;
  border-bottom:1px dashed #d4cfc5;
}

.receipt-meta > div{display:flex;justify-content:space-between}
.receipt-meta > div span:last-child{
  color:#1a1a1a;font-weight:600;
  font-family:var(--f-mono);
}

.receipt-items{margin-bottom:16px}

.r-item{
  display:flex;justify-content:space-between;
  align-items:baseline;
  padding:5px 0;font-size:.78rem;color:#2a2a2a;
  border-bottom:1px dotted #e8e2d8;
}

.r-item:last-child{border-bottom:none}
.r-item .r-left{display:flex;align-items:baseline;gap:6px}
.r-item .r-name{font-weight:500}
.r-item .r-qty{
  color:#8a8578;font-size:.66rem;
  font-family:var(--f-mono);
}
.r-item .r-price{
  font-weight:600;
  font-family:var(--f-mono);
  font-variant-numeric:tabular-nums;
}

.receipt-totals{
  border-top:1.5px dashed #d4cfc5;
  padding-top:12px;
}

.r-total{
  display:flex;justify-content:space-between;
  padding:4px 0;font-size:.76rem;color:#5a5a5a;
}

.r-total span:last-child{
  font-family:var(--f-mono);
  font-weight:500;color:#2a2a2a;
}

.r-total.grand{
  margin-top:8px;padding-top:11px;
  border-top:2px solid #1a1a1a;
}

.r-total.grand span:first-child{
  font-size:.86rem;font-weight:700;
  color:#1a1a1a;letter-spacing:.05em;
}

.r-total.grand span:last-child{
  font-size:1.2rem;font-weight:800;
  color:#1a1a1a;
}

.receipt-buyer{
  margin-top:16px;padding-top:14px;
  border-top:1.5px dashed #d4cfc5;
}

.receipt-buyer-title{
  font-size:.62rem;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;
  color:#8a8578;text-align:center;
  margin-bottom:10px;
}

.buyer-row{
  display:flex;align-items:baseline;
  padding:3px 0;font-size:.74rem;
}

.buyer-row .bl{font-weight:600;color:#5a5a5a;min-width:80px}
.buyer-row .bv{font-weight:500;color:#1a1a1a;flex:1;word-break:break-word}
.buyer-row .bv.empty{color:#b5afa2;font-style:italic;font-weight:400}

.barcode{
  margin:16px 0 4px;
  display:flex;justify-content:center;
  gap:1.5px;height:32px;align-items:flex-end;
}

.barcode span{display:block;background:#1a1a1a;width:2px}

.receipt-thanks{
  text-align:center;margin-top:18px;
  padding-top:14px;border-top:1px dashed #d4cfc5;
  font-size:.68rem;color:#8a8578;
  letter-spacing:.05em;
}

.receipt-thanks strong{
  display:block;font-size:.82rem;
  color:#1a1a1a;margin-bottom:3px;
  letter-spacing:.1em;
}

.receipt-actions{
  padding:14px 20px 18px;
  background:#f2ede4;
  border-top:1px solid #e0dbd0;
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;
}

.rb{
  padding:11px;border-radius:11px;
  font-size:.74rem;font-weight:700;
  transition:all var(--t-fast);
  display:flex;align-items:center;justify-content:center;gap:5px;
  letter-spacing:.02em;
}

.rb-close{background:#e0dbd0;color:#4a4a4a}
.rb-close:hover{background:#d0c9bc}

.rb-print{background:#1a1a1a;color:#faf8f4}
.rb-print:hover{background:#333;transform:translateY(-2px)}

.rb-kitchen{background:#c9a961;color:#1a1408}
.rb-kitchen:hover{background:#e6c980;transform:translateY(-2px)}

/* ============================================================
   STATS PANEL
   ============================================================ */
.stats-panel{
  position:fixed;top:0;right:0;bottom:0;
  width:380px;max-width:100%;
  background:var(--bg-surface);
  border-left:1px solid var(--border-medium);
  box-shadow:-20px 0 60px rgba(0,0,0,.5);
  z-index:200;
  transform:translateX(100%);
  transition:transform var(--t-slow) cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}

.stats-panel.open{transform:translateX(0)}

.stats-header{
  padding:18px 20px 14px;
  padding-top:calc(18px + env(safe-area-inset-top));
  border-bottom:1px solid var(--border-subtle);
  display:flex;justify-content:space-between;align-items:center;
}

.stats-header h3{
  font-family:var(--f-display);
  font-size:.95rem;font-weight:700;
  letter-spacing:.02em;
  display:flex;align-items:center;gap:7px;
}

.stats-body{
  flex:1;overflow-y:auto;
  padding:16px 20px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;
}

.stat-card{
  background:var(--bg-card);
  border:1px solid var(--border-subtle);
  border-radius:var(--r-md);
  padding:14px;
  position:relative;overflow:hidden;
  animation:slideIn var(--t-med);
}

.stat-card::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(201,169,97,.5),transparent);
}

.stat-label{
  font-size:.62rem;font-weight:700;
  color:var(--text-muted);
  letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:7px;
}

.stat-value{
  font-family:var(--f-mono);
  font-size:1.6rem;font-weight:800;
  color:var(--gold-bright);
  letter-spacing:-.03em;
}

.stat-sub{
  font-size:.68rem;color:var(--text-muted);
  margin-top:3px;font-weight:500;
}

.stat-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
}

.mini-stat{
  background:var(--bg-app);
  border:1px solid var(--border-subtle);
  border-radius:var(--r-sm);
  padding:10px;
  transition:all var(--t-fast);
}

.mini-stat:hover{
  border-color:var(--gold);
  transform:translateY(-2px);
}

.mini-stat .lbl{
  font-size:.56rem;font-weight:700;
  color:var(--text-muted);
  letter-spacing:.1em;text-transform:uppercase;
  margin-bottom:3px;
}

.mini-stat .val{
  font-family:var(--f-mono);
  font-size:.9rem;font-weight:700;
  color:var(--text-primary);
}

.top-items{display:flex;flex-direction:column;gap:6px}

.top-item{
  display:flex;align-items:center;gap:9px;
  font-size:.76rem;
  padding:5px 0;
}

.top-item .rank{
  width:22px;height:22px;border-radius:7px;
  background:var(--bg-app);
  border:1px solid var(--border-subtle);
  display:flex;align-items:center;justify-content:center;
  font-size:.64rem;font-weight:700;color:var(--text-muted);
  font-family:var(--f-mono);
}

.top-item .rank.gold{
  background:linear-gradient(145deg,var(--gold-bright),var(--gold));
  color:#1a1408;border-color:transparent;
  box-shadow:var(--glow-gold);
}

.top-item .nm{
  flex:1;font-weight:600;color:var(--text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.top-item .vl{
  font-family:var(--f-mono);font-weight:700;
  color:var(--gold-bright);font-size:.76rem;
}

/* ============================================================
   TOASTS
   ============================================================ */
.toast-wrap{
  position:fixed;
  bottom:calc(20px + env(safe-area-inset-bottom));
  left:50%;transform:translateX(-50%);
  z-index:3000;
  display:flex;flex-direction:column;
  gap:7px;pointer-events:none;
  align-items:center;
  padding:0 16px;
}

.toast{
  padding:11px 18px;
  background:var(--glass-strong);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--border-medium);
  border-radius:100px;
  font-size:.78rem;font-weight:600;
  color:var(--text-primary);
  box-shadow:var(--shadow-lg);
  display:flex;align-items:center;gap:9px;
  animation:toastIn var(--t-spring);
  max-width:90vw;
  pointer-events:auto;
}

@keyframes toastIn{
  from{opacity:0;transform:translateY(30px) scale(.85)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.toast.out{animation:toastOut var(--t-med) forwards}

@keyframes toastOut{
  to{opacity:0;transform:translateY(30px) scale(.85)}
}

.toast .ti{
  width:22px;height:22px;border-radius:50%;
  background:rgba(74,222,128,.18);
  color:var(--green);
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;flex-shrink:0;font-weight:700;
}

.toast.warn .ti{background:rgba(248,113,113,.18);color:var(--red)}
.toast.info .ti{background:rgba(96,165,250,.18);color:var(--blue)}

/* ============================================================
   FAB (mobile)
   ============================================================ */
.fab-cart{
  position:fixed;
  bottom:calc(18px + env(safe-area-inset-bottom));
  right:18px;
  width:58px;height:58px;border-radius:19px;
  background:linear-gradient(145deg,var(--gold-bright),var(--gold));
  color:#1a1408;font-size:1.4rem;
  box-shadow:0 12px 40px rgba(201,169,97,.5),var(--glow-gold);
  z-index:150;
  display:none;align-items:center;justify-content:center;
  transition:all var(--t-spring);
}

.fab-cart::after{
  content:attr(data-count);
  position:absolute;top:-5px;right:-5px;
  min-width:24px;height:24px;padding:0 6px;
  border-radius:100px;
  background:var(--red);color:#fff;
  font-size:.7rem;font-weight:800;
  font-family:var(--f-mono);
  display:flex;align-items:center;justify-content:center;
  border:3px solid var(--bg-app);
  box-shadow:0 4px 12px rgba(248,113,113,.5);
  animation:pulse 2s infinite;
}

.fab-cart:hover{transform:scale(1.08) rotate(-6deg)}
.fab-cart:active{transform:scale(.95)}
.fab-cart.hidden{display:none!important}

/* ============================================================
   KBD HINT
   ============================================================ */
.kbd-hint{
  position:fixed;bottom:18px;left:18px;
  padding:8px 14px;border-radius:100px;
  background:var(--glass);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border-subtle);
  font-size:.66rem;font-weight:600;
  color:var(--text-muted);
  display:flex;align-items:center;gap:6px;
  z-index:40;transition:all var(--t-med);
  cursor:pointer;
}

.kbd-hint:hover{
  color:var(--text-primary);
  border-color:var(--gold);
  transform:translateY(-2px);
  box-shadow:var(--glow-gold);
}

.kbd-hint kbd{
  padding:2px 6px;border-radius:4px;
  background:var(--bg-card);
  border:1px solid var(--border-medium);
  font-family:var(--f-mono);
  font-size:.6rem;font-weight:700;
  color:var(--text-primary);
}

/* ============================================================
   MOBILE HANDLE
   ============================================================ */
.cart-mobile-handle{
  display:none;
  justify-content:center;
  padding:9px 0 5px;
  cursor:pointer;
  position:relative;z-index:3;
}

.cart-mobile-handle::before{
  content:'';width:44px;height:4px;border-radius:100px;
  background:var(--border-strong);
  transition:all var(--t-fast);
}

.cart-area.open .cart-mobile-handle::before{
  background:var(--gold);
  width:56px;
}

.mobile-drawer-backdrop{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  z-index:99;
  opacity:0;
  transition:opacity var(--t-med);
}

.mobile-drawer-backdrop.show{display:block;opacity:1}

/* ============================================================
   RESPONSIVE — LARGE DESKTOP
   ============================================================ */
@media (min-width:1600px){
  .menu-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .main{grid-template-columns:1fr 440px}
}

/* ============================================================
   RESPONSIVE — SMALL DESKTOP
   ============================================================ */
@media (max-width:1180px){
  .main{grid-template-columns:1fr 380px}
  .menu-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
}

/* ============================================================
   RESPONSIVE — iPAD / TABLET
   ============================================================ */
@media (max-width:900px){
  .main{grid-template-columns:1fr}

  .cart-area{
    position:fixed;bottom:0;left:0;right:0;
    top:auto;max-height:88vh;
    border-left:none;
    border-top:1px solid var(--border-medium);
    border-radius:24px 24px 0 0;
    transform:translateY(calc(100% - 56px));
    transition:transform var(--t-slow) cubic-bezier(.4,0,.2,1);
    z-index:100;
    box-shadow:0 -20px 60px rgba(0,0,0,.5);
  }

  .cart-area.open{transform:translateY(0)}
  .cart-mobile-handle{display:flex}
  .fab-cart{display:flex}
  .kbd-hint{display:none}

  .topbar{
    padding:9px 14px;
    padding-top:calc(9px + env(safe-area-inset-top));
    flex-wrap:wrap;gap:9px;
    min-height:auto;
  }

  .brand{padding-right:10px}
  .brand-text h1{font-size:.95rem}
  .brand-text p{font-size:.52rem;letter-spacing:.14em}

  .topbar-center{
    order:3;flex-basis:100%;max-width:none;
  }

  .search-box{max-width:none}
  .live-clock{display:none}

  .main{
    height:calc(100vh - 118px);
    height:calc(100dvh - 118px - env(safe-area-inset-top));
  }

  .hero{padding:14px 16px}
  .hero-text h2{font-size:1.15rem}
  .hero-stats .v{font-size:.95rem}

  .menu-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
}

/* ============================================================
   RESPONSIVE — PHONE
   ============================================================ */
@media (max-width:600px){
  .menu-area{padding:12px 12px 16px;gap:12px}

  .hero{
    padding:12px 14px;
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
  }

  .hero-text h2{font-size:1.05rem}
  .hero-text p{font-size:.7rem}

  .hero-stats{
    width:100%;
    justify-content:space-between;
    gap:10px;
  }

  .hero-stat{text-align:left}
  .hero-stat .v{font-size:.88rem}
  .hero-stat .l{font-size:.52rem}

  .menu-grid{
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:10px;
  }

  .card-body{padding:10px 12px 12px;gap:5px}
  .card-name{font-size:.82rem}
  .card-desc{font-size:.64rem;min-height:1.7em}
  .card-price{font-size:.9rem}
  .add-fab{width:28px;height:28px;font-size:.9rem}
  .card-image .fallback-emoji{font-size:2.5rem}

  .tab{padding:7px 12px;font-size:.68rem}
  .tab .count{font-size:.54rem;padding:1px 5px;min-width:18px}

  .cart-body{padding:10px 14px}
  .cart-header{padding:12px 14px 10px}
  .cart-footer{padding:10px 14px 14px}

  .cart-title-icon{width:36px;height:36px;font-size:1rem}
  .cart-title-text h2{font-size:.88rem}
  .cart-title-text p{font-size:.6rem}

  .item{padding:8px 9px;gap:9px}
  .item-emoji{width:36px;height:36px;font-size:1.1rem;border-radius:10px}
  .item-name{font-size:.76rem}
  .item-unit{font-size:.62rem}
  .item-total{font-size:.76rem;min-width:52px}
  .qty-btn{width:22px;height:22px;font-size:.9rem}
  .qty-val{font-size:.7rem;min-width:20px}

  .receipt-scroll{padding:22px 18px 16px}
  .receipt-actions{
    grid-template-columns:1fr 1fr;
    padding:12px 14px 16px;
    gap:6px;
  }
  .receipt-actions .rb-kitchen{grid-column:1/-1}

  .stats-panel{width:100%}
  .actions{grid-template-columns:1fr}

  .btn-primary{font-size:.78rem;padding:12px 14px}
  .btn-ghost{padding:12px}

  .fab-cart{
    width:54px;height:54px;
    bottom:calc(14px + env(safe-area-inset-bottom));
    right:14px;
    font-size:1.3rem;
    border-radius:17px;
  }

  .toast{padding:10px 16px;font-size:.74rem}

  .brand-mark{width:36px;height:36px;font-size:1.1rem;border-radius:11px}
  .icon-btn{width:36px;height:36px;font-size:.9rem}

  .cart-area{max-height:92vh}

  .summary{padding:10px 12px}
  .sum-row{font-size:.74rem}
  .sum-row.total span:last-child{font-size:1.15rem}

  .pay-btn{font-size:.64rem;padding:8px 3px}
  .pay-btn span:first-child{font-size:.95rem}

  .shop-mode{padding:3px}
  .mode-btn{padding:7px 14px;font-size:.68rem}
}

@media (max-width:400px){
  .menu-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .card-desc{display:none}
  .card-name{min-height:auto;font-size:.78rem}
  .card-body{padding:9px 10px 10px}
  .card-price{font-size:.85rem}
  .item-info{min-width:0}
  .item-total{min-width:48px}
}

/* Landscape phone */
@media (max-height:500px) and (orientation:landscape){
  .main{height:calc(100vh - 64px)}
  .cart-area{max-height:100vh}
  .topbar{min-height:56px}
  .hero{display:none}
}

/* Reduced motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}

<body>

<div class="app">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">
        <h1>Café Lumière</h1>
        <p>POS & Online Shop</p>
      </div>
    </div>

    <div class="topbar-center">
      <div class="search-box" id="searchBox">
        <input type="text" id="searchInput" placeholder="Search menu & products..." autocomplete="off" spellcheck="false" enterkeyhint="search">
        <button class="search-clear" id="searchClear">✕</button>
      </div>
    </div>

    <div class="topbar-right">
      <div class="live-clock">
        <span class="pulse"></span>
        <span id="clockText">--:--:--</span>

      <button class="icon-btn" id="statsBtn" title="Stats (F2)">📊</button>
      <button class="icon-btn" id="themeBtn" title="Theme (Ctrl+D)">🌙</button>

  <!-- MAIN -->
  <main class="main">

    <!-- MENU AREA -->
    <section class="menu-area" id="menuArea">

      <div class="hero">

          <p id="heroSubtitle">Tap any item to add it to your order</p>

        <div class="hero-stats">
          <div class="hero-stat">
            <div class="v" id="heroItems">0</div>
            <div class="l">Cart</div>
          </div>
          <div class="hero-stat">
            <div class="v" id="heroSales">$0</div>
            <div class="l">Today</div>
          </div>
        </div>
      </div>

      <div class="tabs" id="tabs"></div>

    <!-- CART -->
    <aside class="cart-area" id="cartArea">
      <div class="cart-mobile-handle" id="cartHandle"></div>

      <div class="cart-header">
        <div class="cart-header-top">
          <div class="cart-title">
            <div class="cart-title-icon">
              🛒
              <div class="cart-badge" id="cartBadge">0</div>
            </div>
            <div class="cart-title-text">
              <h2>Current Order</h2>
              <p id="cartSubtitle">Empty</p>
            </div>
          </div>
          <button class="clear-btn" id="clearBtn">Clear</button>
        </div>

        <div class="order-type" id="orderType">
          <button class="type-pill active" data-type="dine">🍽 Dine-in</button>
          <button class="type-pill" data-type="take">🥡 Takeaway</button>
          <button class="type-pill" data-type="delivery">🛵 Delivery</button>
        </div>
      </div>

      <div class="cart-body">
        <div class="customer-card">
          <div class="customer-head">
            <div class="icon">👤</div>
            <span>Buyer Info</span>
            <span class="opt">Optional</span>
          </div>
          <div class="inputs">
            <div class="input-wrap">
              <span class="ico">👤</span>
              <input type="text" id="buyerName" placeholder="Buyer name" autocomplete="off" enterkeyhint="next">
            </div>
            <div class="input-wrap">
              <span class="ico">📞</span>
              <input type="tel" id="buyerPhone" placeholder="Phone number" autocomplete="off" inputmode="tel" enterkeyhint="next">
            </div>
            <div class="input-wrap">
              <span class="ico">📍</span>
              <input type="text" id="buyerLocation" placeholder="Location / address" autocomplete="off" enterkeyhint="done">
            </div>
          </div>
        </div>

        <div class="items-list" id="itemsList"></div>
      </div>

      <div class="cart-footer">
        <div id="discountSlot"></div>

        <div class="summary">
          <div class="sum-row">
            <span>Subtotal</span>
            <span id="subEl">$0.00</span>
          </div>
          <div class="sum-row" id="discountRow" style="display:none">
            <span>Discount</span>
            <span id="discEl">−$0.00</span>
          </div>
          <div class="sum-row" id="deliveryRow" style="display:none">
            <span>Delivery</span>
            <span id="deliveryEl">$0.00</span>
          </div>
          <div class="sum-row">
            <span>Tax (8%)</span>
            <span id="taxEl">$0.00</span>
          </div>
          <div class="sum-row total">
            <span>TOTAL</span>
            <span id="totalEl">$0.00</span>
          </div>
        </div>

        <div class="payment-row" id="paymentRow">
          <button class="pay-btn active" data-pay="cash"><span>💵</span>Cash</button>
          <button class="pay-btn" data-pay="card"><span>💳</span>Card</button>
          <button class="pay-btn" data-pay="mobile"><span>📱</span>Mobile</button>
        </div>

        <div class="actions">
          <button class="btn btn-ghost" id="saveBtn" title="Save JSON (Ctrl+S)">💾</button>
          <button class="btn btn-primary" id="checkoutBtn" disabled>
            <span>🧾</span> Checkout · <span id="btnTotal">$0.00</span>
          </button>
        </div>
      </div>
    </aside>
  </main>
</div>

<!-- FAB -->
<button class="fab-cart" id="fabCart" data-count="0" aria-label="Open cart">🛒</button>
<div class="mobile-drawer-backdrop" id="drawerBackdrop"></div>

<!-- STATS -->
<aside class="stats-panel" id="statsPanel">
  <div class="stats-header">

<div class="modal-overlay" id="receiptModal">

/* ============================================================

   ============================================================ */
const LS = {
  save(k, v) { try { localStorage.setItem('lumiere_' + k, JSON.stringify(v)); } catch(e){} },
  load(k, d) { try { const r = localStorage.getItem('lumiere_' + k); return r ? JSON.parse(r) : d; } catch(e){ return d; } }
};

function persist() {
  LS.save('cart', state.cart);
  LS.save('favorites', [...state.favorites]);
  LS.save('theme', state.theme);
  LS.save('stockUsed', state.stockUsed);
  LS.save('stats', {
    sales: state.todaySales, orders: state.todayOrders,
    items: state.todayItems, top: state.topItems,
    date: new Date().toDateString()
  });
}

function hydrate() {
  state.cart = LS.load('cart', []);
  state.favorites = new Set(LS.load('favorites', []));
  state.theme = LS.load('theme', 'dark');
  state.stockUsed = LS.load('stockUsed', {});
  const s = LS.load('stats', null);
  if (s && s.date === new Date().toDateString()) {
    state.todaySales = s.sales || 0;
    state.todayOrders = s.orders || 0;
    state.todayItems = s.items || 0;
    state.topItems = s.top || {};
  }
}

  .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');

/* ============================================================
   SOUND
   ============================================================ */
let audioCtx = null;
function beep(freq = 660, dur = 0.06, vol = 0.035) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.value = freq;
    o.type = 'sine';
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}

function chime() {
  beep(880, 0.08, 0.045);
  setTimeout(() => beep(1320, 0.14, 0.04), 70);
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = 'toast' + (type !== 'success' ? ' ' + type : '');
  const icons = { success:'✓', warn:'⚠', info:'ℹ' };
  el.innerHTML = `<div class="ti">${icons[type] || '✓'}</div><span>${esc(msg)}</span>`;
  $('toastWrap').appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 300);
  }, 2400);
}

/* ============================================================
   RIPPLE
   ============================================================ */
document.addEventListener('click', e => {
  const btn = e.target.closest('.btn, .icon-btn, .qty-btn, .pay-btn, .type-pill, .tab, .rb, .fab-cart, .mode-btn');
  if (!btn) return;
  const r = btn.getBoundingClientRect();
  const rip = document.createElement('span');
  const size = Math.max(r.width, r.height);
  rip.className = 'ripple';
  rip.style.width = rip.style.height = size + 'px';
  rip.style.left = (e.clientX - r.left - size/2) + 'px';
  rip.style.top = (e.clientY - r.top - size/2) + 'px';
  btn.appendChild(rip);
  setTimeout(() => rip.remove(), 700);
});

      <span>${c.icon}</span><span>${c.label}</span><span class="count">${count}</span>

function getItemsInMode() {
  if (state.shopMode === 'all') return MENU;
  return MENU.filter(m => m.type === state.shopMode);
}

/* ============================================================
   MENU
   ============================================================ */
function getFilteredMenu() {
  const q = state.search.toLowerCase().trim();
  return MENU.filter(m => {
    // Mode filter
    if (state.shopMode !== 'all' && m.type !== state.shopMode) return false;
    // Category filter
    if (state.category !== 'all' && m.cat !== state.category) return false;
    // Search
    if (q) {
      const haystack = (m.name + ' ' + m.cat + ' ' + (m.desc || '')).toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });
}

function getStockRemaining(item) {
  const stock = typeof item.stock === 'number' ? item.stock : 999;
  const used = state.stockUsed[item.id] || 0;
  return Math.max(0, stock - used);
}

function buildImageHtml(m) {
  if (m.image && m.image.trim()) {
    return `<img src="${esc(m.image)}" alt="${esc(m.name)}" loading="lazy"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
      <div class="fallback-emoji" style="display:none">${m.emoji}</div>`;
  }
  return `<div class="fallback-emoji">${m.emoji}</div>`;
}

function renderMenu() {
  const items = getFilteredMenu();
  const grid = $('menuGrid');

  if (items.length === 0) {
    grid.innerHTML = `
      <div class="no-results">
        <div class="icon">🔍</div>
        <h3>No items found</h3>
        <p>${state.search ? `Try a different search for "${esc(state.search)}"` : 'This category is empty'}</p>
      </div>`;
    return;
  }

  grid.innerHTML = items.map((m, idx) => {
    const fav = state.favorites.has(m.id);
    const remaining = getStockRemaining(m);
    const outOfStock = remaining <= 0;

    const badges = [];
    if (m.type === 'shop') badges.push('<span class="card-badge badge-stock">🛍 Shop</span>');
    else if (m.id === 'matcha' || m.id === 'smoothie') badges.push('<span class="card-badge badge-new">New</span>');
    else if (m.id === 'espresso' || m.id === 'croissant') badges.push('<span class="card-badge badge-hot">🔥 Hot</span>');
    else if (m.id === 'cheesecake') badges.push('<span class="card-badge badge-pop">★ Popular</span>');

    return `
      <div class="menu-card ${fav ? 'fav' : ''} ${outOfStock ? 'out-of-stock' : ''}"
           data-id="${m.id}" style="animation-delay:${idx * 25}ms">
        <div class="card-image">
          ${buildImageHtml(m)}
          ${badges.join('')}
          <button class="fav-btn" data-fav="${m.id}" aria-label="Favorite">${fav ? '★' : '☆'}</button>
        </div>
        <div class="card-body">
          <div class="card-cat">${esc(m.cat.replace('shop-',''))}</div>
          <div class="card-name">${esc(m.name)}</div>
          <div class="card-desc">${esc(m.desc || '')}</div>
          <div class="card-bottom">
            <div class="card-price">${fmt(m.price)}</div>
            <div class="add-fab">${outOfStock ? '✕' : '+'}</div>
          </div>
        </div>
      </div>`;
  }).join('');
}

/* ============================================================
   CART ACTIONS
   ============================================================ */
function addToCart(item) {
  const remaining = getStockRemaining(item);
  const inCart = state.cart.find(i => i.id === item.id);
  const cartQty = inCart ? inCart.quantity : 0;

  if (cartQty + 1 > remaining) {
    toast(`Only ${remaining} left in stock`, 'warn');
    beep(300, 0.1, 0.04);
    return;
  }

  if (inCart) {
    inCart.quantity++;
  } else {
    state.cart.push({
      id:item.id, name:item.name, price:item.price,
      emoji:item.emoji, image:item.image || '',
      quantity:1, type:item.type
    });
  }

  renderCart(); persist();
  beep(840, 0.05, 0.03);

  if (isMobile() && state.cart.length === 1) {
    setTimeout(() => openCartDrawer(), 400);
  }
}

function updateQty(index, delta) {
  const item = state.cart[index];
  if (!item) return;

  if (delta > 0) {
    const menuItem = MENU.find(m => m.id === item.id);
    const remaining = menuItem ? getStockRemaining(menuItem) : 999;
    if (item.quantity + delta > remaining) {
      toast(`Only ${remaining} left in stock`, 'warn');
      beep(300, 0.1, 0.04);
      return;
    }
  }

  item.quantity += delta;
  if (item.quantity <= 0) state.cart.splice(index, 1);
  renderCart(); persist();
  beep(delta > 0 ? 800 : 500, 0.04, 0.02);
}

function clearCart() {
  if (state.cart.length === 0) return;
  state.cart = [];
  state.discount = null;
  renderCart(); persist();
  toast('Cart cleared', 'info');
  beep(400, 0.08, 0.03);
}

/* ============================================================
   TOTALS
   ============================================================ */
function getTotals() {
  const subtotal = state.cart.reduce((s,i) => s + i.price * i.quantity, 0);
  const discountAmt = state.discount ? subtotal * state.discount.pct : 0;
  const afterDiscount = subtotal - discountAmt;

  let deliveryFee = 0;
  if (state.orderType === 'delivery' && afterDiscount < FREE_DELIVERY_MIN && afterDiscount > 0) {
    deliveryFee = DELIVERY_FEE;
  }

  const taxable = afterDiscount + deliveryFee;
  const tax = taxable * TAX_RATE;
  const total = taxable + tax;

  return { subtotal, discountAmt, deliveryFee, tax, total };
}

/* ============================================================
   RENDER CART
   ============================================================ */
function buildItemEmoji(item) {
  if (item.image && item.image.trim()) {
    return `<img src="${esc(item.image)}" alt="" onerror="this.style.display='none';this.parentElement.textContent='${item.emoji}';">`;
  }
  return item.emoji;
}

function renderCart() {
  const totalItems = state.cart.reduce((s,i) => s + i.quantity, 0);

  const badge = $('cartBadge');
  badge.textContent = totalItems;
  badge.classList.remove('bump');
  if (totalItems > 0) { void badge.offsetWidth; badge.classList.add('bump'); }

  const fab = $('fabCart');
  fab.dataset.count = totalItems;
  if (totalItems === 0) fab.classList.add('hidden');
  else fab.classList.remove('hidden');

  $('cartSubtitle').textContent = totalItems === 0
    ? 'Empty'
    : `${totalItems} item${totalItems > 1 ? 's' : ''} · ${state.orderType}`;

  const list = $('itemsList');
  if (state.cart.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🛒</div>
        <h3>Nothing here yet</h3>
        <p>Tap any item to add it</p>
      </div>`;
  } else {
    list.innerHTML = state.cart.map((item, i) => `
      <div class="item">
        <div class="item-emoji">${buildItemEmoji(item)}</div>
        <div class="item-info">
          <div class="item-name">${esc(item.name)}</div>
          <div class="item-unit">${fmt(item.price)} × ${item.quantity}</div>
        </div>
        <div class="item-controls">
          <button class="qty-btn dec" data-dec="${i}">−</button>
          <span class="qty-val">${item.quantity}</span>
          <button class="qty-btn inc" data-inc="${i}">+</button>
        </div>
        <div class="item-total">${fmt(item.price * item.quantity)}</div>
      </div>
    `).join('');
  }

  const { subtotal, discountAmt, deliveryFee, tax, total } = getTotals();

  $('subEl').textContent = fmt(subtotal);
  $('taxEl').textContent = fmt(tax);
  $('totalEl').textContent = fmt(total);
  $('btnTotal').textContent = fmt(total);
  $('heroItems').textContent = totalItems;
  $('heroSales').textContent = fmt(state.todaySales);

  if (state.discount && discountAmt > 0) {
    $('discountRow').style.display = '';
    $('discEl').textContent = '−' + fmt(discountAmt);
  } else {
    $('discountRow').style.display = 'none';
  }

  if (deliveryFee > 0) {
    $('deliveryRow').style.display = '';
    $('deliveryEl').textContent = fmt(deliveryFee);
  } else {
    $('deliveryRow').style.display = 'none';
  }

  const slot = $('discountSlot');
  if (state.discount) {
    slot.innerHTML = `
      <div class="discount-tag">
        <span>🏷 ${esc(state.discount.label)} applied</span>
        <button id="removeDiscount">✕</button>
      </div>`;
  } else {
    slot.innerHTML = `
      <div class="discount-row">
        <input type="text" id="discountInput" placeholder="Discount code..." maxlength="12" autocomplete="off" autocapitalize="characters">
        <button class="apply-btn" id="applyDiscount">Apply</button>
      </div>`;
  }

  $('checkoutBtn').disabled = state.cart.length === 0;
}

  const inc = e.target.closest('[data-inc]');
  const dec = e.target.closest('[data-dec]');
  if (inc) updateQty(+inc.dataset.inc, 1);
  else if (dec) updateQty(+dec.dataset.dec, -1);
});

    state.discount = null;

  const btn = e.target.closest('.pay-btn');
  if (!btn) return;
  state.payment = btn.dataset.pay;
  [...$('paymentRow').children].forEach(p => p.classList.toggle('active', p === btn));
  beep(600, 0.04, 0.02);
});

/* ============================================================
   MOBILE DRAWER
   ============================================================ */
function openCartDrawer() {
  if (!isMobile()) return;
  $('cartArea').classList.add('open');
  $('drawerBackdrop').classList.add('show');
}
function closeCartDrawer() {
  $('cartArea').classList.remove('open');
  $('drawerBackdrop').classList.remove('show');
}

$('cartHandle').addEventListener('click', () => {
  if ($('cartArea').classList.contains('open')) closeCartDrawer();
  else openCartDrawer();
});

$('fabCart').addEventListener('click', openCartDrawer);
$('drawerBackdrop').addEventListener('click', closeCartDrawer);

document.addEventListener('click', e => {
  if (!isMobile()) return;
  const cartArea = $('cartArea');
  const fab = $('fabCart');
  if (!cartArea.classList.contains('open')) return;
  if (cartArea.contains(e.target)) return;
  if (fab.contains(e.target)) return;
  if (e.target.closest('.modal-overlay')) return;
  closeCartDrawer();
});

/* ============================================================
   RECEIPT
   ============================================================ */
function buildReceiptHtml() {
  const { subtotal, discountAmt, deliveryFee, tax, total } = getTotals();
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
  const timeStr = now.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
  const orderNo = 'ORD-' + String(Math.floor(Math.random()*9000)+1000);

  const buyer = {
    name: $('buyerName').value.trim(),
    phone: $('buyerPhone').value.trim(),
    location: $('buyerLocation').value.trim()
  };

  const itemsHtml = state.cart.map(i => `
    <div class="r-item">
      <div class="r-left">
        <span class="r-name">${esc(i.name)}</span>
        <span class="r-qty">× ${i.quantity}</span>
      </div>
      <span class="r-price">${fmt(i.price * i.quantity)}</span>
    </div>
  `).join('');

  const hasBuyer = buyer.name || buyer.phone || buyer.location;
  const buyerHtml = hasBuyer ? `
    <div class="receipt-buyer">
      <div class="receipt-buyer-title">— Buyer Information —</div>
      <div class="buyer-row"><span class="bl">Buyer</span><span class="bv ${!buyer.name?'empty':''}">${buyer.name ? esc(buyer.name) : '—'}</span></div>
      <div class="buyer-row"><span class="bl">Phone</span><span class="bv ${!buyer.phone?'empty':''}">${buyer.phone ? esc(buyer.phone) : '—'}</span></div>
      <div class="buyer-row"><span class="bl">Location</span><span class="bv ${!buyer.location?'empty':''}">${buyer.location ? esc(buyer.location) : '—'}</span></div>
    </div>` : '';

  let barcodeHtml = '<div class="barcode">';
  for (let i = 0; i < 48; i++) {
    const h = 12 + Math.floor(Math.random()*20);
    const w = Math.random() > 0.6 ? 3 : 2;
    barcodeHtml += `<span style="height:${h}px;width:${w}px"></span>`;
  }
  barcodeHtml += '</div>';

  const orderTypeLabels = { dine:'Dine-in', take:'Takeaway', delivery:'Delivery' };

  return `
    <div class="receipt-scroll">
      <div class="receipt-header">
        <div class="receipt-logo">✦</div>
        <h3>${STORE_NAME}</h3>
        <div class="sub">${STORE_ADDRESS}</div>
        <div class="sub">${STORE_PHONE}</div>
      </div>

      <div class="receipt-meta">
        <div><span>Date</span><span>${dateStr}</span></div>
        <div><span>Time</span><span>${timeStr}</span></div>
        <div><span>Order</span><span>${orderNo}</span></div>
        <div><span>Type</span><span>${orderTypeLabels[state.orderType]}</span></div>
      </div>

      <div class="receipt-items">${itemsHtml}</div>

      <div class="receipt-totals">
        <div class="r-total"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
        ${discountAmt > 0 ? `<div class="r-total"><span>Discount (${state.discount.label})</span><span>−${fmt(discountAmt)}</span></div>` : ''}
        ${deliveryFee > 0 ? `<div class="r-total"><span>Delivery Fee</span><span>${fmt(deliveryFee)}</span></div>` : ''}
        <div class="r-total"><span>Tax (8%)</span><span>${fmt(tax)}</span></div>
        <div class="r-total grand"><span>TOTAL</span><span>${fmt(total)}</span></div>
        <div class="r-total"><span>Payment</span><span>${state.payment.toUpperCase()}</span></div>
      </div>

      ${buyerHtml}
      ${barcodeHtml}

      <div class="receipt-thanks">
        <strong>THANK YOU</strong>
        Please come again ✦
      </div>
    </div>

    <div class="receipt-actions">
      <button class="rb rb-close" id="closeReceipt">Close</button>
      <button class="rb rb-kitchen" id="kitchenReceipt">🍳 Kitchen</button>
      <button class="rb rb-print" id="printReceipt">🖨 Print</button>
    </div>
  `;
}

function showReceipt() {
  if (state.cart.length === 0) return;

  const { total } = getTotals();
  state.todaySales += total;
  state.todayOrders++;
  state.todayItems += state.cart.reduce((s,i) => s + i.quantity, 0);
  state.cart.forEach(i => {
    state.topItems[i.name] = (state.topItems[i.name] || 0) + i.quantity;
    state.stockUsed[i.id] = (state.stockUsed[i.id] || 0) + i.quantity;
  });
  persist();

  $('receiptCard').innerHTML = buildReceiptHtml();
  $('receiptModal').classList.add('active');

  $('closeReceipt').addEventListener('click', closeReceipt);
  $('printReceipt').addEventListener('click', printReceipt);
  $('kitchenReceipt').addEventListener('click', printKitchen);

  chime();
}

function closeReceipt() {
  $('receiptModal').classList.remove('active');
  state.cart = [];
  state.discount = null;
  $('buyerName').value = '';
  $('buyerPhone').value = '';
  $('buyerLocation').value = '';
  renderCart(); renderMenu(); persist();
  if (isMobile()) closeCartDrawer();
}

$('receiptModal').addEventListener('click', e => {
  if (e.target === $('receiptModal')) closeReceipt();
});

$('checkoutBtn').addEventListener('click', showReceipt);
